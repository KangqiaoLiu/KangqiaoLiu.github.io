name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Daily refresh copies the latest course PDF into the published site.
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Every deployment copies the compiled course PDF directly into this site.
      - name: Read public Advanced Quantum Mechanics materials
        uses: actions/checkout@v4
        with:
          repository: KangqiaoLiu/advanced-quantum-mechanics-lecture-note
          ref: main
          path: course-source
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          gem install bundler
          bundle install --jobs 4 --retry 3
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install Pillow

      - name: Generate publication thumbnails
        run: python scripts/generate_publication_thumbnails.py

      - name: Build AI Research CV PDF
        run: |
          if ! command -v pdflatex >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
          fi
          mkdir -p /tmp/ai-cv-build
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/ai-cv-build files/Kangqiao_Liu_AI_Research_CV.tex
          cp /tmp/ai-cv-build/Kangqiao_Liu_AI_Research_CV.pdf files/Kangqiao_Liu_AI_Research_CV.pdf

      # Keep the PDF in the source branch too, so branch-based Pages builds retain it.
      - name: Synchronize generated AI Research CV PDF
        if: github.ref == 'refs/heads/master'
        run: |
          pdf=files/Kangqiao_Liu_AI_Research_CV.pdf
          tex=files/Kangqiao_Liu_AI_Research_CV.tex
          if git ls-files --error-unmatch "$pdf" >/dev/null 2>&1; then
            last_pdf_commit=$(git log -1 --format=%H -- "$pdf")
            if git diff --quiet "$last_pdf_commit" HEAD -- "$tex"; then
              exit 0
            fi
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$pdf"
          if ! git diff --cached --quiet -- "$pdf"; then
            git commit -m "Update generated AI Research CV PDF" -- "$pdf"
            git push origin HEAD:master
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --trace

      - name: Publish linked course PDF and interactive materials
        run: python scripts/publish_course_resources.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
